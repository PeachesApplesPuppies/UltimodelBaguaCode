name: Real Mobius kernel
on:
  workflow_dispatch:
  push:
    paths:
      - 'lean_verification/real_kernel/**'
      - '.github/workflows/mobius-real-kernel.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Lean and Mathlib
        working-directory: lean_verification/real_kernel
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Check real kernel
        working-directory: lean_verification/real_kernel
        run: |
          set -o pipefail
          lake env lean MobiusBoundary.lean | tee verification.log
          if grep -Eiq 'sorryAx|declaration uses .?sorry' verification.log; then exit 1; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: real-kernel-verification
          path: lean_verification/real_kernel/verification.log
